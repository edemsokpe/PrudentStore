<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1a5be0">
<title>Admin | PRUDENT TECH Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../theme.css">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<div id="login" hidden>
  <form class="login-card" id="loginForm" novalidate>
    <div class="brand">PRUDENT <span>TECH</span> admin</div>
    <label>Email<input id="lEmail" type="email" autocomplete="email" required></label>
    <label>Password<input id="lPass" type="password" autocomplete="current-password" required></label>
    <div class="msg err" id="lMsg" role="alert"></div>
    <button class="btn" type="submit">Log in</button>
  </form>
</div>

<div id="shell" hidden>
  <aside class="side">
    <div class="brand">PRUDENT <span>TECH</span></div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <a href="../index.html" target="_blank" rel="noopener">Open store</a>
      <button id="logout" class="linkbtn">Log out</button>
    </div>
  </aside>
  <main class="main">
    <h1 id="title"></h1>
    <div id="view"></div>
  </main>
</div>

<dialog id="dlg"><div class="dlg-head"><h2 id="dlgTitle"></h2><button class="linkbtn" id="dlgClose" aria-label="Close">Close</button></div><div id="dlgBody"></div></dialog>
<div id="toast" role="status"></div>
<script src="../config.js"></script>
<script src="admin.js"></script>
</body>
</html>
