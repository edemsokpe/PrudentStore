<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a5be0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PRUDENT TECH">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Saved items | PRUDENT TECH Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="store.css">
</head>
<body>
<main class="wrap">
  <section>
    <div class="sec-head"><h2>Saved items</h2><a href="account.html">My account</a></div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="msg" hidden></div>
  </section>
</main>
<script src="config.js"></script>
<script src="app.js"></script>
<script src="pwa.js"></script>
<script>
mountChrome("account");
if (!Auth.isIn()) location.replace("login.html?next=wishlist.html");
(async () => {
  try {
    const items = await api("/me/wishlist");
    if (!items.length) { $("#msg").hidden = false; $("#msg").innerHTML = 'Nothing saved yet. Tap the heart on a product to save it.<br><a class="link-btn" href="index.html">Browse products</a>'; return; }
    $("#grid").innerHTML = items.map(productCard).join("");
    loadWish();
  } catch (e) { $("#msg").hidden = false; $("#msg").textContent = e.message; }
})();
</script>
</body>
</html>
