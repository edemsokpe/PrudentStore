<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a5be0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PRUDENT TECH">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Log in | PRUDENT TECH Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="store.css">
</head>
<body>
<main class="wrap">
  <div class="narrow info-card">
    <div class="tabs" role="tablist">
      <button id="tabIn" class="on" role="tab">Log in</button>
      <button id="tabUp" role="tab">Create account</button>
    </div>

    <form class="form" id="loginForm" novalidate>
      <div class="field"><label for="liEmail">Email</label><input id="liEmail" type="email" autocomplete="email" required></div>
      <div class="field"><label for="liPass">Password</label><input id="liPass" type="password" autocomplete="current-password" required></div>
      <div class="form-msg" id="liMsg" role="alert"></div>
      <a class="link-btn" href="forgot.html">Forgot your password?</a>
      <button class="btn-primary" type="submit">Log in</button>
    </form>

    <form class="form" id="regForm" novalidate hidden>
      <div class="field"><label for="rName">Full name</label><input id="rName" autocomplete="name" required></div>
      <div class="field"><label for="rEmail">Email</label><input id="rEmail" type="email" autocomplete="email" required></div>
      <div class="field"><label for="rPhone">Phone (optional)</label><input id="rPhone" type="tel" autocomplete="tel"></div>
      <div class="field"><label for="rPass">Password (8 characters or more)</label><input id="rPass" type="password" autocomplete="new-password" minlength="8" required></div>
      <div class="form-msg" id="rMsg" role="alert"></div>
      <button class="btn-primary" type="submit">Create account</button>
    </form>
  </div>
</main>
<script src="config.js"></script>
<script src="app.js"></script>
<script src="pwa.js"></script>
<script>
mountChrome("account");
const next = safeNext(new URLSearchParams(location.search).get("next"));
if (Auth.isIn()) location.replace(next);

function show(which) {
  const login = which === "in";
  $("#loginForm").hidden = !login; $("#regForm").hidden = login;
  $("#tabIn").classList.toggle("on", login); $("#tabUp").classList.toggle("on", !login);
}
$("#tabIn").onclick = () => show("in"); $("#tabUp").onclick = () => show("up");
if (location.hash === "#register") show("up");

async function submit(form, msgEl, path, body) {
  const btn = form.querySelector("button[type=submit]");
  msgEl.className = "form-msg"; msgEl.textContent = "";
  btn.disabled = true;
  try {
    const r = await api(path, { method: "POST", body });
    Auth.set(r.access_token, r.user, true);
    location.href = next;
  } catch (e) {
    msgEl.className = "form-msg err";
    msgEl.textContent = e.message === "Failed to fetch" ? "Cannot reach the server. Check your connection and try again." : e.message;
    btn.disabled = false;
  }
}
$("#loginForm").onsubmit = (e) => { e.preventDefault(); submit(e.target, $("#liMsg"), "/auth/login", { email: $("#liEmail").value, password: $("#liPass").value }); };
$("#regForm").onsubmit = (e) => { e.preventDefault(); submit(e.target, $("#rMsg"), "/auth/register", { full_name: $("#rName").value, email: $("#rEmail").value, phone: $("#rPhone").value || null, password: $("#rPass").value }); };
</script>
</body>
</html>
