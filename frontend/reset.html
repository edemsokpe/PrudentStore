<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a5be0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PRUDENT TECH">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="referrer" content="no-referrer">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="store.css">
<title>Choose a new password | PRUDENT TECH Store</title>
</head>
<body>
<main class="wrap">
  <div class="narrow info-card">
    <h2 style="margin:0 0 6px;font-size:20px">Choose a new password</h2>
    <form class="form" id="rForm" novalidate>
      <div class="field"><label for="p1">New password (8 characters or more)</label><input id="p1" type="password" autocomplete="new-password" minlength="8" required></div>
      <div class="field"><label for="p2">Type it again</label><input id="p2" type="password" autocomplete="new-password" minlength="8" required></div>
      <div class="form-msg" id="rMsg" role="alert"></div>
      <button class="btn-primary" type="submit">Save new password</button>
    </form>
    <div id="done" hidden>
      <div class="warn">Your password has been changed. You can log in with it now.</div>
      <p><a class="btn-primary" href="login.html" style="display:inline-block;text-decoration:none">Log in</a></p>
    </div>
    <div id="bad" hidden>
      <div class="warn">This reset link is missing, invalid or has expired.</div>
      <p><a class="link-btn" href="forgot.html">Request a new link</a></p>
    </div>
  </div>
</main>
<script src="config.js"></script>
<script src="app.js"></script>
<script src="pwa.js"></script>
<script>
mountChrome("account");
// Keep the token out of the address bar and browser history once we have it.
const token = new URLSearchParams(location.search).get("token");
history.replaceState(null, "", "reset.html");
if (!token) { $("#rForm").hidden = true; $("#bad").hidden = false; }

$("#rForm").onsubmit = async (e) => {
  e.preventDefault();
  const msg = $("#rMsg"), btn = e.target.querySelector("button");
  msg.className = "form-msg err"; msg.textContent = "";
  if ($("#p1").value.length < 8) { msg.textContent = "Use at least 8 characters"; return; }
  if ($("#p1").value !== $("#p2").value) { msg.textContent = "The two passwords do not match"; return; }
  btn.disabled = true;
  try {
    await api("/auth/reset", { method: "POST", body: { token, new_password: $("#p1").value } });
    Auth.clear();
    e.target.hidden = true; $("#done").hidden = false;
  } catch (er) {
    if (/invalid|expired/i.test(er.message)) { e.target.hidden = true; $("#bad").hidden = false; }
    else { msg.textContent = er.message === "Failed to fetch" ? "Cannot reach the server. Check your connection and try again." : er.message; btn.disabled = false; }
  }
};
</script>
</body>
</html>
